# https://docs.netlify.com/configure-builds/overview/
[build]
  command = "npm ci && npm run build"
  publish = "dist"

# Netlify sets NETLIFY=true during their CI build; repeat here so local `netlify build` matches.
[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"

# SPA fallback if you switch from HashRouter to BrowserRouter later
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
